name: pistak
description: "PISTAK — Matchday made simple. Live match tracking for roller hockey."
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: ^3.6.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  cryptography: ^2.7.0
  package_info_plus: ^10.2.2
  file_picker: ^13.1.0
  web: ^1.1.1
  uuid: ^4.5.1
  wakelock_plus: ^1.2.10
  record: ^7.1.1
  audioplayers: ^6.8.1
  image_picker: ^1.2.3
  pdf: ^3.13.1
  share_plus: ^13.3.1
  http: any
  flutter_secure_storage: any
  connectivity_plus: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/sports/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
  generate: true
